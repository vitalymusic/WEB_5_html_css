<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adaptīvais dizains</title>


    <style>
        /* Noklusētais stils, kas strādā vienmēr */
        
        body{
            margin: 0;
            font-family: sans-serif;
            background-color: aqua;
            font-size: 18px;
        }
        nav{
            height: 50px;
            background-color: black;
            display: flex;
            justify-content: space-evenly;
            align-items: center;

            a{
                text-decoration: none;
                color:white;
                transition: all 0.1s cubic-bezier(0,.05,.77,1.65)

            }
            a:hover{
                font-size: 1.2em;
                color:red;
                transform: rotate(10deg);
                transition: 
                    color 1s linear, 
                    font-size 2s linear,
                    all 0.3s cubic-bezier(0,.05,.77,1.65)
            }
        }
        section{
            width: 70%;
            margin: 30px auto;
            padding: 20px;
            border: 1px solid black;
            background-color: white;
            display: flex;
            justify-content: center;
            gap:30px;
            div{
               padding: 20px;
               border: 1px solid red; 
               
               h2{
                font-size: 3em;
               }
               p{
                 font-size: 1em;
               }
            }

            /* align-items: center; */

        }

        /* Stils Planšetdatoriem */

        @media screen and (min-width: 768px) and (max-width: 1023px)
        {
            body{
                font-size: 14px;
                background-color: rgb(212, 255, 0);
            }


        }

        @media screen and (max-width: 767px)
        {

            body{
                font-size: 12px;
                background-color: rgb(0, 157, 255);    
            }

            nav{
                flex-direction: column;
                justify-content: center;
                align-items: end;
                gap:30px;
                padding: 20px 30px;
                height: auto;
            }

            section{
                  flex-direction: column;
                  width: 90%;
                    .third{
                        display: none;
                    }

                  
            }

        }












        section div:hover{-webkit-animation:jello-horizontal .9s ease-in both;animation:jello-horizontal .9s ease-in both;
        cursor: pointer;    
        }


        /* Animācijas */

    </style>
</head>
<body>  
        <nav>
            <a href="">Lapa1</a>
            <a href="">Lapa2</a>
            <a href="">Lapa3</a>
        </nav>

        <section>
            <div>
                <h2>Pirmais teksts</h2>
                <p>pirmais teksts</p>
            </div>
            <div>
                <h2>Otrais teksts</h2>
                <p>Otrais teksts</p>
            </div>
            <div class="third">
                <h2>Trešais teksts</h2>
                <p>Trešais teksts</p>
            </div>
        </section>
</body>
</html>
