<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Adaptīvais dizains</title>


    <style>
        /* Noklusētais stils, kas strādā vienmēr */

        body{
            margin: 0;
            font-family: sans-serif;
            background-color: aqua;
            font-size: 18px;
        }
        nav{
            height: 50px;
            background-color: black;
            display: flex;
            justify-content: space-evenly;
            align-items: center;

            a{
                text-decoration: none;
                color:white;

            }
            a:hover{
                color:red;
            }
        }
        section{
            width: 70%;
            margin: 30px auto;
            padding: 20px;
            border: 1px solid black;
            background-color: white;
            display: flex;
            justify-content: center;
            gap:30px;
            div{
               padding: 20px;
               border: 1px solid red;     
            }

            /* align-items: center; */

        }


    </style>
</head>
<body>  
        <nav>
            <a href="">Lapa1</a>

        </nav>

        <section>

            <div>

            </div>
            <div>
